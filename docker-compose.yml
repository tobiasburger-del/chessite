# Local Postgres for development: `docker compose up -d`
# DATABASE_URL=postgres://chess:chess@localhost:5432/chess
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
      POSTGRES_DB: chess
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
